[project]
name = "cyclic_feasibility"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10",
    "nested-sampler",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pywin32>=312",
    "scipy>=1.18.1",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv.sources]
nested-sampler = { git = "https://github.com/Kai360-dot/NestedSampler.git" }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["helpers", "hysys"]